<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>TechFlow - Sistema de Tarefas</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <h1 class="mb-4">Gerenciamento de Tarefas</h1>

    <!-- Filtro de status -->
    <form method="GET" action="/" class="mb-3">
        <label for="status" class="form-label">Filtrar por status:</label>
        <select name="status" id="status" class="form-select" onchange="this.form.submit()">
            <option value="">Todos</option>
            <option value="Pendente" {% if request.args.get('status') == 'Pendente' %}selected{% endif %}>Pendente</option>
            <option value="Concluída" {% if request.args.get('status') == 'Concluída' %}selected{% endif %}>Concluída</option>
        </select>
    </form>

    <!-- Lista de tarefas -->
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Título</th>
                <th>Descrição</th>
                <th>Prioridade</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            {% for tarefa in tarefas %}
            <tr>
                <td>{{ tarefa["titulo"] }}</td>
                <td>{{ tarefa["descricao"] }}</td>
                <td>{{ tarefa["prioridade"] }}</td>
                <td>{{ tarefa["status"] }}</td>
                <td>
                    <!-- Botões de ação -->
                    <form method="POST" action="/remover" style="display:inline;">
                        <input type="hidden" name="titulo" value="{{ tarefa['titulo'] }}">
                        <button type="submit" class="btn btn-danger btn-sm">Remover</button>
                    </form>
                    <form method="POST" action="/editar" style="display:inline;">
                        <input type="hidden" name="titulo" value="{{ tarefa['titulo'] }}">
                        <button type="submit" class="btn btn-warning btn-sm">Editar</button>
                    </form>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <!-- Formulário de adicionar tarefa -->
    <h2 class="mt-4">Adicionar Tarefa</h2>
    <form method="POST" action="/adicionar">
        <div class="mb-2">
            <input type="text" name="titulo" placeholder="Título" class="form-control" required>
        </div>
        <div class="mb-2">
            <input type="text" name="descricao" placeholder="Descrição" class="form-control" required>
        </div>
        <div class="mb-2">
            <select name="prioridade" class="form-select">
                <option>Alta</option>
                <option>Média</option>
                <option>Baixa</option>
            </select>
        </div>
        <div class="mb-2">
            <select name="status" class="form-select">
                <option>Pendente</option>
                <option>Concluída</option>
            </select>
        </div>
        <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

</body>
</html>
